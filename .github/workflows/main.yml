name: Tests

on: [pull_request, push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # No setup-python step: .python-version pins the interpreter and uv
      # fetches it. requires-python = ">=3.14" makes a matrix pointless.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov=ravel --cov-branch

      - name: Run lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run type checker
        run: uv run mypy
