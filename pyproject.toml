[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ravel"
version = "0.1.dev0"
description = "Yet another framework for choice-based interactive fiction."
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Eyk", email = "david@worldsenoughstudios.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "attrs",
    "click",
    "colorclass",
    "parsimonious>=0.10,<0.11",
    "python-slugify",
    "syml>=1.0,<2",
]

[project.scripts]
ravel = "ravel.cli:main"

[project.urls]
Homepage = "https://github.com/eykd/ravel"

[tool.hatch.build.targets.wheel]
packages = ["src/ravel"]

[dependency-groups]
dev = [
    "coverage",
    "hypothesis>=6.168.3",
    "ipython",
    "mypy",
    "pdbpp",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["acceptance: end-to-end user-story tests"]

[tool.coverage.run]
branch = true
source = ["ravel", "tools"]
omit = ["*/test*.py", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "I", "UP"]
# printf-style formatting is used pervasively for error messages; rewriting it
# is unrelated to the 3.14 migration.
ignore = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["ravel", "tools"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["parsimonious.*", "colorclass.*", "slugify.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ravel.engine.*",
    "ravel.app.*",
    "ravel.adapters.*",
    "ravel.cli",
    "ravel.types",
    "ravel.queries",
]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
